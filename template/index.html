.ccb{--bg:#F2F0EC;--surface:#FFFFFF;--ink:#1A1D24;--muted:#5A5F68;--line:#DEDAD3;--brand:#8E2A1E;--ochre:#C8742A;--sea:#0E3A57;
  --crit:#B42318;--crit-bg:#FBEAE8;--warn:#9A5B05;--warn-bg:#FCF1DE;--info:#2B5FA6;--info-bg:#E7EEF9;--ok:#2F6F4E;--ok-bg:#E5F2EA;
  --brandfont:"Marcellus SC","Times New Roman",serif;--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  font-family:var(--body);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;
  max-width:1120px;margin:0 auto;padding-block:24px 36px;display:flex;flex-direction:column;gap:16px}
.ccb *{box-sizing:border-box}
.ccb h1,.ccb h2,.ccb h3{margin:0;text-wrap:balance}
.ph{color:var(--muted);font-style:italic;font-weight:400;opacity:.75}
.banner{position:relative;border-radius:18px;background-size:cover;background-position:center 40%;color:#FFFFFF;padding:26px 26px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;min-height:220px;border-bottom:6px solid var(--brand);overflow:hidden}
.b-txt{max-width:calc(100% - 300px);position:relative;z-index:1}
.b-eyebrow{margin:0 0 6px;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#FFD9B8}
.banner h1{font-family:var(--brandfont);font-size:clamp(30px,4.6vw,48px);line-height:1.05;font-weight:400;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.b-meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px;font-size:14px}
.b-meta b{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#FFD9B8;margin-right:6px}
.b-meta .ph{color:#E8E2DA}
.logo{position:absolute;top:-16px;right:-22px;padding:40px 56px 46px 62px;background:radial-gradient(closest-side,rgba(255,255,255,.86) 0%,rgba(255,255,255,.66) 42%,rgba(255,255,255,.28) 72%,rgba(255,255,255,0) 100%)}
.logo img{width:230px;display:block;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-size:24px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sec{width:28px;height:28px;border-radius:7px;background:var(--brand);color:var(--surface);font:700 14px/28px var(--mono);text-align:center}
.tag{font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1.5px dashed var(--line);border-radius:999px;padding:3px 9px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kv{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv>span{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font-size:15px;overflow-wrap:anywhere}
.water{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;background:var(--sea);border-radius:12px;padding:10px 12px;color:#FFFFFF}
.wl{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#BFE3EE;align-self:center;margin-right:6px}
.w{background:rgba(255,255,255,.1);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column}
.w>span{font:600 10.5px var(--mono);text-transform:uppercase;color:#BFE3EE}.w b{font-size:14px}.w .ph{color:#DCEAF0}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sg h3{font-family:var(--display);font-size:18px;margin-bottom:6px;color:var(--brand)}
.sg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sg li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:14px}
.chip{flex:0 0 auto;font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
.s-yes{background:var(--crit);color:var(--surface)}.s-no{background:var(--ok-bg);color:var(--ok)}.s-na{border:1.5px dashed var(--line);color:var(--muted)}
.note{margin:0;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 12px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:6px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.ph-box{aspect-ratio:4/3;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font:600 13px var(--mono)}
.photos figcaption{font-size:13px;color:var(--muted)}
.assess{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:center}
.dx{border:2px solid var(--brand);border-radius:14px;padding:14px 16px}
.dx-l{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--brand);color:var(--surface);padding:4px 9px;border-radius:6px}
.dx-n{margin:10px 0 0;font-family:var(--display);font-size:32px;font-weight:800;line-height:1.05;color:var(--brand)}
.dx-a{margin:2px 0 0;font-weight:600}
.dx-r{margin:8px 0 0;font-size:14px;color:var(--muted)}
.conf{display:flex;flex-direction:column;align-items:center;text-align:center}
.conf p{margin:2px 0 0}
.diffs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.df{border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;border:1px solid var(--line)}
.df.crit{background:var(--crit-bg)}.df.warn{background:var(--warn-bg)}.df.info{background:var(--info-bg)}.df.ok{background:var(--ok-bg)}
.dn{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font:700 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:var(--surface);white-space:nowrap}
.pill.crit{background:var(--crit)}.pill.warn{background:var(--warn)}.pill.info{background:var(--info)}.pill.ok{background:var(--ok)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:680px;font-size:14px}
.tbl th{text-align:left;font:600 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink);padding:6px 8px}
.tbl td{border-bottom:1px solid var(--line);padding:8px}
.tbl .res{font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.acts li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ac{flex:0 0 96px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--brand);padding-top:2px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--ochre);display:flex;flex-direction:column;gap:10px}
.tl li{display:flex;flex-direction:column;font-size:14px;position:relative}
.tl li::before{content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--ochre)}
.td{font:700 12px var(--mono);color:var(--ochre)}
.foot{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--brand);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sign div{border-bottom:1.5px solid var(--ink);padding-bottom:6px;display:flex;flex-direction:column}
.sign div>span{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.refs{font-size:13px;color:var(--muted)}.refs ol{margin:4px 0 0;padding-left:20px}.refs b{color:var(--ink)}
.fine{margin:0;font-size:12px;color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ccb{--bg:#111316;--surface:#1A1D22;--ink:#ECEAE6;--muted:#A9AAAE;--line:#33363C;--brand:#E07A62;--ochre:#E3A160;--sea:#123E5A;
  --crit:#F07161;--crit-bg:#3A1A17;--warn:#E3A43A;--warn-bg:#35270F;--info:#7FA7E8;--info-bg:#17243A;--ok:#6CC08F;--ok-bg:#14291D}}
:root[data-theme="dark"] .ccb{--bg:#111316;--surface:#1A1D22;--ink:#ECEAE6;--muted:#A9AAAE;--line:#33363C;--brand:#E07A62;--ochre:#E3A160;--sea:#123E5A;
  --crit:#F07161;--crit-bg:#3A1A17;--warn:#E3A43A;--warn-bg:#35270F;--info:#7FA7E8;--info-bg:#17243A;--ok:#6CC08F;--ok-bg:#14291D}
@media (max-width:860px){.grid4{grid-template-columns:1fr 1fr}.signs,.photos,.assess,.two{grid-template-columns:1fr}.diffs{grid-template-columns:1fr 1fr}.sign{grid-template-columns:1fr}.banner{padding-top:128px}.b-txt{max-width:100%}.logo{padding:26px 34px 30px 40px}.logo img{width:170px}}
@media (max-width:460px){.diffs{grid-template-columns:1fr}.logo img{width:150px}}
`;ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(CCBCaseReport));

</script>
